# ==========================================================
#  SyncDBJOB — Reverse Proxy (nginx)
#  วางที่: /etc/nginx/sites-available/syncdbjob
#  เปิดใช้: ln -s /etc/nginx/sites-available/syncdbjob /etc/nginx/sites-enabled/
# ==========================================================

# ---- สร้างรหัสผ่านสำหรับ Basic Auth (ทำครั้งเดียว) ----
#   sudo htpasswd -c /etc/nginx/.htpasswd admin
#   sudo htpasswd /etc/nginx/.htpasswd user2      # เพิ่มผู้ใช้
#   sudo htpasswd -B /etc/nginx/.htpasswd user3   # ใช้ bcrypt (แนะนำ)

# ---- HTTP -> HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name syncdbjob.example.com;   # เปลี่ยนเป็นโดเมนจริง

    # ให้ certbot ต่ออายุ SSL ได้โดยไม่ต้องปิด auth
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name syncdbjob.example.com;   # เปลี่ยนเป็นโดเมนจริง

    # SSL (certbot จะสร้างให้อัตโนมัติ)
    ssl_certificate     /etc/letsencrypt/live/syncdbjob.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syncdbjob.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ปิดการแสดงเวอร์ชัน nginx
    server_tokens off;

    # ไฟล์ Excel สูงสุด 100MB (ต้อง >= ค่า limits.fileSize ของ multer)
    client_max_body_size 120M;

    # ------------------------------------------------------------
    #  ระบบมี Login ภายในแอปแล้ว (ตาราง newfin_users)
    #  บรรทัดสองข้อนี้เป็นชั้นการป้องกันเพิ่มเติม (defense in depth)
    #  ถ้าไม่ต้องการใช้ Basic Auth ให้ comment ออกได้
    #
    #  ⚠️ ต้องตั้ง APP_TRUST_PROXY=true ใน .env ของแอป
    #     เพื่อให้ cookie ตั้ง flag Secure อัตโนมัติเมื่อเข้าผ่าน HTTPS
    #     และเพื่อให้นับจำนวนครั้งที่ล็อกอินผิดได้ถูกต้อง (ใช้ IP จริง)
    # ------------------------------------------------------------
    auth_basic           "SyncDBJOB";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # ป้องกัน brute force ทาง HTTP Basic
    # (ประกาศ zone ไว้ในไฟล์ deploy/nginx-limit.conf ที่ /etc/nginx/conf.d/)
    limit_req zone=syncdbjob burst=5 nodelay;

    access_log /var/log/nginx/syncdbjob.access.log;
    error_log  /var/log/nginx/syncdbjob.error.log;

    location / {
        limit_req zone=syncdbjob burst=5 nodelay;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # ไฟล์ Excel ใหญ่อาจใช้เวลาอัปโหลดนาน
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_request_buffering off;
    }
}
